apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.ClassName: nginx
spec:
  rules:
  - host: www.iam7hills.com
    http:
      paths:
      - path: /first_app
        pathType: Prefix
        backend:
          service:
            name: first-app-svc
            port:
              number: 80

      - path: /second_app
        pathType: Prefix
        backend:
          service:
            name: second-app-svc
            port:
              number: 80

      - path: /third_app
        pathType: Prefix
        backend:
          service:
            name: third-app-svc
            port:
              number: 80
