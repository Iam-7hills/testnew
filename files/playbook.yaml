- name: Deploy environment-specific profile and run script
  hosts: all
  become: yes
  vars:
    env: "dev"  # override with -e env=qa or set via AAP
    target_user: "myuser"
    profile_template: "/tmp/profile.template"
    profile_script: "/tmp/apply_profile.sh"
    final_profile: "/home/{{ target_user }}/.bash_profile"
    remote_script_path: "/opt/scripts/my_script.sh"  # already exists remotely

  tasks:

    - name: Copy profile template from relative path
      copy:
        src: iics/files/profile.template
        dest: "{{ profile_template }}"
        mode: '0644'

    - name: Copy apply_profile shell script
      copy:
        src: iics/files/apply_profile.sh
        dest: "{{ profile_script }}"
        mode: '0755'

    - name: Generate environment-specific .bash_profile
      shell: "{{ profile_script }} {{ env }} {{ profile_template }} {{ final_profile }}"

    - name: Run shell script with sourced profile
      shell: |
        bash -c "source {{ final_profile }} && bash {{ remote_script_path }}"
      args:
        executable: /bin/bash
